<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cart — Clothinn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="./assets/logo.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        <img src="./assets/logo.png" alt="Clothinn" class="brand-logo site-logo" data-logo-light="./assets/logo.png" data-logo-dark="./assets/logo-dark.png">
      </a>
      <nav class="site-nav">
        <button id="themeToggle" aria-label="Toggle theme">☾</button>
        <a href="index.html#products-oversize">Shop</a>
        <a href="checkout.html" class="cart-link">Checkout <span id="cartCount" class="badge">0</span></a>
      </nav>
    </header>

    <main class="checkout">
      <div class="section-head">
        <h2>Your Cart</h2>
      </div>
      <section class="card order-summary">
        <div id="cartItems" class="summary-items"></div>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cartSubtotal">₹0.00</span>
        </div>
        <div style="display:flex; gap:10px;">
          <a class="btn btn-secondary" href="index.html">Continue Shopping</a>
          <a class="btn btn-primary" href="checkout.html">Proceed to Checkout</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-grid">
          <div class="footer-brand">
            <img src="./assets/logo-dark.png" alt="Brand" class="footer-logo">
            <div class="footer-subscribe">
              <strong>Subscribe now</strong>
              <input type="email" placeholder="Enter your email address" aria-label="Email address">
            </div>
          </div>
          <div class="footer-links">
            <strong>Quick Links</strong>
            <a href="index.html">Home</a>
            <a href="index.html#products-oversize">Shop</a>
            <a href="index.html#products-regular">Round Necks</a>
            <a href="index.html#products-hoodies">Hoodies</a>
            <a href="#">Privacy Policy</a>
            <a href="#">T&C</a>
          </div>
          <div class="footer-contact">
            <strong>Get in touch</strong>
            <div>Support: <a href="mailto:ashxstore19@gmail.com">ashxstore19@gmail.com</a></div>
            <div><strong>Reach us</strong></div>
            <div>Bengaluru</div>
          </div>
        </div>
        <div class="footer-badges">
          <span class="footer-badge">🚚 Free Shipping</span>
          <span class="footer-badge">🔁 Easy Exchanges</span>
        </div>
        <div>© <span id="year"></span> Clothinn. All rights reserved.</div>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
  </html>
